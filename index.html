<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mimoca | Feito com Afeto</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #FFF8F1;
            color: #654B3E;
            text-align: center;
        }

        header {
            background: #E8B9A8;
            padding: 50px 20px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .container {
            padding: 60px 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 400px;
            margin: auto;
            box-shadow: 0 4px 15px #00000010;
        }

        footer {
            margin-top: 60px;
            padding: 20px;
            font-size: 14px;
        }

        #teste-supabase {
            margin-top: 25px;
            padding: 15px;
            border-radius: 10px;
            background: #FFF8F1;
            font-size: 14px;
        }
    </style>

    <!-- Biblioteca Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Configuração Supabase -->
    <script>
        const SUPABASE_URL =
            "https://pckdixsmulkvdezptlbn.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_esy8-aj09LTZ_L_QKEzH9w_8YHGdRlI";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );
    </script>

</head>

<body>

    <header>
        <h1>Mimoca</h1>
        <p>Feito com Afeto ❤️</p>
    </header>

    <div class="container">

        <div class="card">

            <h2>Bem-vindo à Mimoca!</h2>

            <p>Delícias feitas com carinho.</p>

            <p>Nosso sistema está chegando!</p>

            <!-- Resultado do teste -->
            <div id="teste-supabase">
                Aguardando teste...
            </div>

        </div>

    </div>

    <footer>
        © 2026 Mimoca — Feito com Afeto
    </footer>

    <!-- Teste de comunicação com Supabase -->
    <script>

        async function testarSupabase() {

            const resultado =
                document.getElementById("teste-supabase");

            resultado.textContent =
                "Testando conexão com Supabase...";

            try {

                const resposta = await fetch(
                    SUPABASE_URL + "/auth/v1/health",
                    {
                        headers: {
                            "apikey": SUPABASE_KEY
                        }
                    }
                );

                if (resposta.ok) {

                    resultado.textContent =
                        "✅ Comunicação com Supabase funcionando!";

                } else {

                    resultado.textContent =
                        "❌ Erro na conexão. Código: " +
                        resposta.status;

                }

            } catch (erro) {

                resultado.textContent =
                    "❌ Não foi possível conectar ao Supabase.";

                console.error(erro);

            }

        }

        testarSupabase();

    </script>

</body>

</html>
